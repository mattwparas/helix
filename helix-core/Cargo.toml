[package]
name = "helix-core"
description = "Helix editor core editing primitives"
include = ["src/**/*", "README.md"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
unicode-lines = ["ropey/unicode_lines"]
integration = []
steel = ["dep:steel-core"]

[dependencies]
helix-stdx = { path = "../helix-stdx" }
helix-loader = { path = "../helix-loader" }
helix-event = { path = "../helix-event" }
helix-parsec = { path = "../helix-parsec" }

ignore.workspace = true
ropey.workspace = true
smallvec = "1.15"
smartstring = "1.0.1"
unicode-segmentation.workspace = true
# unicode-width is changing width definitions
# that both break our logic and disagree with common
# width definitions in terminals, we need to replace it.
# For now lets lock the version to avoid rendering glitches
# when installing without `--locked`
unicode-width = "=0.1.12"
unicode-general-category = "1.1"
slotmap.workspace = true
tree-house.workspace = true
once_cell = "1.21"
arc-swap = "1"
regex = "1"
bitflags.workspace = true
foldhash.workspace = true

log = "0.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml.workspace = true

imara-diff =  "0.2.0"
encoding_rs = "0.8"

chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }

textwrap = "0.16.2"

steel-core = { workspace = true, optional = true }
nucleo.workspace = true
parking_lot.workspace = true
globset.workspace = true
regex-cursor = "0.1.5"

# Pinned to a rev where the macOS (FSEvents) and Windows backends pass CI.
# The PR (#14544) pinned 57713a3e, where macOS/Windows CI were still red.
filesentry = { git = "https://github.com/helix-editor/filesentry", rev = "9d594d545c47f5386b6410efcc36868c7d5e55bd" }

[dev-dependencies]
quickcheck.workspace = true
indoc = "2.0.6"
